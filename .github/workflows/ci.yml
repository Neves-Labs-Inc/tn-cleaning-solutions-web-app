name: CI

on:
  pull_request:
    branches: [main, develop]
  # A merge to main re-runs CI, then deploys to production.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are superseded; cancelling a main run could stop a deploy mid-migration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The type gate: `next build` fails on TypeScript errors by default, so no separate tsc step.
      - name: Build
        run: npm run build

  changes:
    # On push, paths-filter would need a git checkout, and db runs regardless there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # paths-filter reads the PR's changed files through the GitHub API, so no checkout is needed.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            db:
              - 'supabase/**'
              - 'src/types/database.ts'
              - '.github/workflows/ci.yml'
              - 'scripts/data-purge/**'
              - 'tests/data-purge/**'

  db:
    needs: changes
    # A skipped job counts as passing for required checks, so app-only PRs stay green.
    # A push to main always runs the DB checks before deploy. `changes` is skipped there, and
    # without the status functions that skip would skip db too.
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || needs.changes.outputs.db == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      # Only Postgres, auth (the pgTAP test writes auth.users), PostgREST and Kong are needed.
      - name: Start Supabase
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

      # Name-level check that src/types/database.ts matches the migrated public schema.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install the locked dependencies
        run: npm ci

      - name: Check database types for drift
        run: npm run db:check-types

      # The one-time data purge, run only against this local stack and always rolled back.
      - name: Test the data purge script
        run: node --test "tests/data-purge/*.test.ts"
        env:
          PURGE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  deploy:
    needs: [app, changes, db]
    # Without the status functions a skipped needed job would skip deploy too, so check
    # for failure/cancel explicitly instead.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Prod secrets live in this environment, whose branch policy allows only main,
    # so a workflow edited on another branch can't read them.
    environment: Production
    # Queue deploys instead of cancelling one mid-migration.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # Includes devDependencies: the Vercel CLI is an exact-pinned one, so the lockfile
      # pins the whole tree that later receives VERCEL_TOKEN.
      - name: Install the locked dependencies
        run: npm ci

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      # Migrations go first: if they fail the job stops and the app never ships ahead of its schema.
      # Each step gets only the secrets it needs, as env vars, never inline. The CLIs read
      # SUPABASE_DB_PASSWORD and VERCEL_TOKEN from env, which keeps them off argv (`ps`).
      - name: Link the prod Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # --yes answers the "push these migrations?" prompt so the step never waits on input.
      - name: Migrate the prod database
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Pull Vercel production settings
        run: npx vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: npx vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel production
        run: npx vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
